\* A design that should satisfy every property: one machine-wide lock around
\* every watches.json read-modify-write, run_watch reads its checkpoint under
\* that lock and holds it to the save, and the seen-id checkpoint (late
\* arrivals included). Shows the properties are satisfiable, so a violation elsewhere
\* is the code, not a broken property.
SPECIFICATION Spec
CONSTANTS
    ServerThreads = {"s1", "s2"}
    CliThreads = {"c1"}
    NumWatches = 2
    NumEvents = 3
    MaxOps = 2
    MaxRebuilds = 2
    Locked = {"add", "remove", "run_save"}
    LockScope = "machine"
    RunHoldsLock = TRUE
    LateArrivals = TRUE
    Checkpoint = "seen_ids"
