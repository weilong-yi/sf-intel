\* The code as it is: a machine-wide store lock (_store()) around every read and write of
\* the watch files, a per-watch run lock, uid matching, and the seen-id checkpoint. The web
\* server (two concurrent request threads) and a scheduled `python -m src.watch run` share them.
SPECIFICATION Spec
CONSTANTS
    ServerThreads = {"s1", "s2"}
    CliThreads = {"c1"}
    NumWatches = 2
    NumEvents = 3
    MaxOps = 2
    MaxRebuilds = 2
    Locked = {"add", "remove", "run_save"}
    LateArrivals = TRUE
    LockScope = "machine"
    RunLock = TRUE
    MatchUid = TRUE
    Checkpoint = "seen_ids"
